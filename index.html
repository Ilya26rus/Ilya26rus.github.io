<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание занятий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213A;
    --ink-soft:#3A4664;
    --paper:#F1EFE9;
    --paper-2:#E7E4DC;
    --line:#D8D4C8;
    --teal:#2F6F63;
    --teal-soft:#DCEBE6;
    --gold:#C9972E;
    --gold-soft:#F3E7CC;
    --clay:#A9463F;
    --clay-soft:#F1DCDA;
    --white:#FBFAF7;
    --radius:10px;
    --shadow:0 2px 10px rgba(22,33,58,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:8px;background:var(--ink);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}
  .brand h1{font-size:19px;color:var(--ink);}

  .ghost-btn{background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;}
  .ghost-btn:hover{background:var(--white);border-color:var(--ink-soft);}
  .primary-btn{background:var(--ink);color:var(--white);border:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .primary-btn:hover{background:var(--ink-soft);}
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;}
  .link-btn{background:none;border:none;color:var(--teal);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;font-family:'Inter',sans-serif;}
  .danger-link{background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;text-decoration:underline;font-family:'Inter',sans-serif;}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .intro{padding:18px 20px;margin-bottom:16px;}
  .intro p{margin:0 0 12px;font-size:14.5px;line-height:1.55;color:var(--ink-soft);}
  .intro p:last-child{margin-bottom:0;}

  .legend{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px;}
  .legend-row{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px;background:var(--paper);border-radius:8px;padding:8px 10px;}
  .legend-days{display:flex;gap:4px;flex-wrap:wrap;}
  .legend-day-tile{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:3px 6px;border-radius:5px;background:var(--white);border:1px solid var(--line);color:var(--ink-soft);}
  .legend-label{font-size:13px;font-weight:500;}
  .legend-row.avail .legend-label{color:var(--teal);}
  .legend-row.limited .legend-label{color:var(--gold);}
  .legend-row.off .legend-label{color:var(--clay);}
  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .avail .legend-dot{background:var(--teal);}
  .limited .legend-dot{background:var(--gold);}
  .off .legend-dot{background:var(--clay);}

  .hint-box{background:var(--ink);color:var(--gold-soft);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.5;margin-top:4px;}

  .calendar-section{margin-bottom:20px;}
  .week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .week-nav .range-label{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}
  .nav-btns{display:flex;gap:6px;}
  .nav-btns button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-size:14px;color:var(--ink);}
  .nav-btns button:hover{background:var(--paper-2);}

  .days-scroll{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  @media(max-width:680px){.days-scroll{grid-template-columns:repeat(4,1fr);}}
  .day-card{border:1px solid var(--line);border-radius:9px;background:var(--white);padding:10px 6px;text-align:center;cursor:pointer;transition:.15s;position:relative;}
  .day-card:hover{border-color:var(--ink-soft);}
  .day-card.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset;}
  .day-card.disabled{opacity:.35;cursor:not-allowed;}
  .day-card .dow{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .day-card .dnum{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;margin:3px 0;}
  .day-card .status-dot{width:7px;height:7px;border-radius:50%;margin:0 auto;}
  .day-card.status-avail .status-dot{background:var(--teal);}
  .day-card.status-limited .status-dot{background:var(--gold);}
  .day-card.status-off .status-dot{background:var(--clay);}
  .day-card.status-none .status-dot{background:var(--line);}
  .day-card.today .dnum{color:var(--teal);}

  .slots-panel{margin-top:14px;padding:16px 18px;}
  .slots-panel.hidden{display:none;}
  .slots-panel h3{font-size:15px;margin-bottom:2px;}
  .slots-panel .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .slot-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .slot-btn{font-family:'IBM Plex Mono',monospace;border:1px solid var(--teal);color:var(--teal);background:var(--teal-soft);padding:8px 12px;border-radius:7px;font-size:13px;cursor:pointer;font-weight:600;}
  .slot-btn:hover{background:var(--teal);color:var(--white);}
  .slot-btn.taken{border-color:var(--line);color:var(--ink-soft);background:var(--paper);cursor:not-allowed;text-decoration:line-through;}
  .no-slots{font-size:13.5px;color:var(--ink-soft);padding:6px 0;}

  .booking-form{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .booking-form label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;margin-top:10px;}
  .booking-form input, .booking-form textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13.5px;background:var(--paper);}
  .booking-form textarea{resize:vertical;min-height:56px;}
  .form-actions{display:flex;gap:8px;margin-top:12px;}
  .confirm-msg{background:var(--teal-soft);color:var(--teal);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-top:10px;}

  .propose-own{margin-top:12px;}

  .overlay{position:fixed;inset:0;background:rgba(22,33,58,0.4);z-index:40;}
  .overlay.hidden{display:none;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--white);z-index:50;box-shadow:-8px 0 30px rgba(0,0,0,.15);overflow-y:auto;padding:20px;transform:translateX(0);}
  .drawer.hidden{display:none;}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .drawer h2{font-size:16px;}
  .drawer-section{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .drawer-section:last-child{border-bottom:none;}
  .drawer-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:10px;}
  .field-row{margin-bottom:10px;}
  .field-row label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field-row input, .field-row textarea, .field-row select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13.5px;font-family:'Inter',sans-serif;background:var(--paper);}
  .inline-fields{display:flex;gap:8px;}
  .inline-fields>*{flex:1;}
  .day-checks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .day-check{position:relative;}
  .day-check input{position:absolute;opacity:0;}
  .day-check span{display:inline-block;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .day-check input:checked+span{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .window-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .window-row input{flex:1;}
  .window-row button{background:none;border:none;color:var(--clay);cursor:pointer;font-size:16px;line-height:1;padding:0 4px;}
  .add-window-btn{font-size:12px;color:var(--teal);background:none;border:none;cursor:pointer;text-decoration:underline;margin-bottom:8px;}
  .rule-item, .booking-item, .blocked-item{background:var(--paper);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .rule-item .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .rule-days-label{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;}
  .rule-windows-label{color:var(--ink-soft);margin-top:3px;font-size:12.5px;}
  .rule-recur-label{color:var(--ink-soft);font-size:11.5px;margin-top:3px;font-style:italic;}
  .booking-item .row1{display:flex;justify-content:space-between;}
  .booking-item .bdate{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .booking-item .bname{margin-top:3px;font-weight:600;}
  .booking-item .bnote{margin-top:3px;color:var(--ink-soft);}
  .empty-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .recur-extra{margin-top:6px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);}
  .toast.hidden{display:none;}
  .loading-note{font-size:13px;color:var(--ink-soft);padding:20px;text-align:center;}
  .privacy-note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading-note" id="loadingNote">Загружаю расписание…</div>
</div>

<div class="overlay hidden" id="overlay"></div>
<aside class="drawer hidden" id="adminDrawer"></aside>
<div class="toast hidden" id="toast"></div>

<script>
const DOW_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];

let state = {
  settings: { headerMessage: "Ниже — моё расписание на ближайшие недели. Выбирайте удобный слот из предложенных, и я закреплю его за вами 🙂", workStart: "09:00", workEnd: "21:00", duration: 60 },
  rules: [],
  blockedDates: [],
  bookings: []
};

let viewWeekStart = getMonday(new Date());
let selectedDateISO = null;
let selectedSlot = null;

// ---------- storage (JSONBin.io — работает на GitHub Pages) ----------
// 1) Зарегистрируйся на https://jsonbin.io (бесплатно), создай Bin с содержимым {}
// 2) Вставь сюда свой X-Master-Key и ID бина:
const JSONBIN_ID  = "ВСТАВЬ_BIN_ID_СЮДА";
const JSONBIN_KEY = "ВСТАВЬ_X-MASTER-KEY_СЮДА";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

const DEFAULTS = {
  settings: { headerMessage: "Ниже — моё расписание на ближайшие недели. Выбирайте удобный слот из предложенных, и я закреплю его за вами 🙂", workStart: "09:00", workEnd: "21:00", duration: 60 },
  rules: [
    { id:'r1', days:[0,2,4,5,6], windows:[{start:'09:00',end:'21:00'}], startDate: todayISO(), endDate: null },
    { id:'r2', days:[1,3], windows:[{start:'11:00',end:'12:00'},{start:'20:00',end:'21:00'}], startDate: todayISO(), endDate: null }
  ],
  blockedDates: [],
  bookings: []
};

async function loadAll(){
  try{
    const res = await fetch(JSONBIN_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_KEY } });
    const data = await res.json();
    const remote = data.record || {};
    for(const key of ['settings','rules','blockedDates','bookings']){
      state[key] = remote[key] ?? DEFAULTS[key];
    }
  }catch(e){
    for(const key of ['settings','rules','blockedDates','bookings']) state[key] = DEFAULTS[key];
    showToast('Не удалось загрузить данные — показаны значения по умолчанию.');
  }
}
async function save(key){
  try{
    await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify({ settings: state.settings, rules: state.rules, blockedDates: state.blockedDates, bookings: state.bookings })
    });
  }catch(e){
    showToast('Не удалось сохранить. Проверьте интернет-соединение.');
  }
}

// ---------- date helpers ----------
function pad(n){return n<10?'0'+n:n;}
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function getMonday(d){ const date=new Date(d); const day=(date.getDay()+6)%7; date.setDate(date.getDate()-day); date.setHours(0,0,0,0); return date; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addMonths(d,n){ const r=new Date(d); r.setMonth(r.getMonth()+n); return r; }
function isPast(dateISO){ return dateISO < todayISO(); }
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }

// ---------- schedule logic ----------
function ruleActiveOn(rule, dateISO){
  if(rule.startDate && dateISO < rule.startDate) return false;
  if(rule.endDate && dateISO > rule.endDate) return false;
  return true;
}
function mergeWindows(list){
  if(!list.length) return [];
  const sorted = list.map(w=>({s:timeToMin(w.start), e:timeToMin(w.end)})).sort((a,b)=>a.s-b.s);
  const out=[sorted[0]];
  for(let i=1;i<sorted.length;i++){
    const last=out[out.length-1];
    if(sorted[i].s<=last.e){ last.e=Math.max(last.e,sorted[i].e); }
    else out.push(sorted[i]);
  }
  return out.map(w=>({start:minToTime(w.s), end:minToTime(w.e)}));
}
function windowsForWeekday(dow, referenceISO){
  const raw=[];
  state.rules.forEach(r=>{
    if(r.days.includes(dow) && ruleActiveOn(r, referenceISO)) raw.push(...r.windows);
  });
  return mergeWindows(raw);
}
function windowsForDate(dateISO){
  if(state.blockedDates.includes(dateISO)) return [];
  const d = new Date(dateISO+'T00:00:00');
  const dow = (d.getDay()+6)%7;
  return windowsForWeekday(dow, dateISO);
}
function dayStatus(windows){
  if(!windows.length) return 'off';
  const covers = windows.length===1 && timeToMin(windows[0].start)<=timeToMin(state.settings.workStart) && timeToMin(windows[0].end)>=timeToMin(state.settings.workEnd);
  return covers ? 'avail' : 'limited';
}
function generateSlots(windows){
  const dur = Number(state.settings.duration)||60;
  const slots=[];
  windows.forEach(w=>{
    let s=timeToMin(w.start); const e=timeToMin(w.end);
    while(s+dur<=e){ slots.push(minToTime(s)); s+=dur; }
  });
  return slots;
}
function bookedTimesFor(dateISO){
  return state.bookings.filter(b=>b.date===dateISO).map(b=>b.time);
}

// ---------- rendering ----------
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function renderApp(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">РЗ</div>
        <h1>Расписание занятий</h1>
      </div>
    </div>
    <div class="card intro">
      <p id="headerMsgText"></p>
      <div class="legend" id="legendRows"></div>
      <div class="hint-box">Я подбираю время из своего рабочего графика — выбирайте слот из предложенных ниже, и оно закрепится за вами. Если ни один вариант не подходит, оставьте заметку с удобным для вас временем — я подстроюсь, если получится.</div>
    </div>
    <div class="calendar-section card" style="padding:16px 18px;">
      <div class="week-nav">
        <div class="nav-btns"><button id="prevWeek">←</button><button id="todayBtn" title="Сегодня">●</button><button id="nextWeek">→</button></div>
        <span class="range-label mono" id="weekRangeLabel"></span>
      </div>
      <div class="days-scroll" id="daysScroll"></div>
    </div>
    <div class="card slots-panel hidden" id="slotsPanel"></div>
  `;
  document.getElementById('headerMsgText').textContent = state.settings.headerMessage;
  document.getElementById('prevWeek').onclick = ()=>{ viewWeekStart = addDays(viewWeekStart,-7); renderWeek(); };
  document.getElementById('nextWeek').onclick = ()=>{ viewWeekStart = addDays(viewWeekStart,7); renderWeek(); };
  document.getElementById('todayBtn').onclick = ()=>{ viewWeekStart = getMonday(new Date()); renderWeek(); };
  renderLegend();
  renderWeek();
}

function renderLegend(){
  const box = document.getElementById('legendRows');
  box.innerHTML='';
  const ref = todayISO();
  const groups = {}; // label -> {status, days[]}
  for(let dow=0;dow<7;dow++){
    const w = windowsForWeekday(dow, ref);
    const status = dayStatus(w);
    let label;
    if(status==='off') label='недоступно';
    else if(status==='avail') label='в любое время';
    else label = w.map(x=>`${x.start}–${x.end}`).join(' или ');
    const key = status+'|'+label;
    if(!groups[key]) groups[key]={status,label,days:[]};
    groups[key].days.push(dow);
  }
  Object.values(groups).sort((a,b)=> (a.status==='avail'?0:a.status==='limited'?1:2) - (b.status==='avail'?0:b.status==='limited'?1:2)).forEach(g=>{
    const row = el(`<div class="legend-row ${g.status}">
      <div class="legend-days">${g.days.map(d=>`<span class="legend-day-tile">${DOW_SHORT[d]}</span>`).join('')}</div>
      <div class="legend-label"><span class="legend-dot"></span>${g.label}</div>
    </div>`);
    box.appendChild(row);
  });
  if(!Object.keys(groups).length){
    box.appendChild(el(`<p class="empty-note">Расписание пока не настроено.</p>`));
  }
}

function renderWeek(){
  const scroll = document.getElementById('daysScroll');
  scroll.innerHTML='';
  const label = document.getElementById('weekRangeLabel');
  const weekEnd = addDays(viewWeekStart,6);
  label.textContent = `${toISO(viewWeekStart).slice(5).replace('-','.')} – ${toISO(weekEnd).slice(5).replace('-','.')}`;
  for(let i=0;i<7;i++){
    const d = addDays(viewWeekStart,i);
    const iso = toISO(d);
    const past = isPast(iso);
    const windows = windowsForDate(iso);
    const status = past ? 'none' : dayStatus(windows);
    const isToday = iso===todayISO();
    const card = el(`<div class="day-card status-${status} ${past?'disabled':''} ${isToday?'today':''} ${selectedDateISO===iso?'selected':''}">
      <div class="dow">${DOW_SHORT[(d.getDay()+6)%7]}</div>
      <div class="dnum">${d.getDate()}</div>
      <div class="status-dot"></div>
    </div>`);
    if(!past){
      card.onclick = ()=>{ selectedDateISO=iso; selectedSlot=null; renderWeek(); renderSlotsPanel(); };
    }
    scroll.appendChild(card);
  }
}

function renderSlotsPanel(){
  const panel = document.getElementById('slotsPanel');
  if(!selectedDateISO){ panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  const d = new Date(selectedDateISO+'T00:00:00');
  const windows = windowsForDate(selectedDateISO);
  const allSlots = generateSlots(windows);
  const booked = bookedTimesFor(selectedDateISO);
  const dateLabel = `${DOW_FULL[(d.getDay()+6)%7]}, ${d.getDate()} ${['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'][d.getMonth()]}`;
  panel.innerHTML = `
    <h3>${dateLabel[0].toUpperCase()+dateLabel.slice(1)}</h3>
    <div class="sub">Длительность занятия — ${state.settings.duration} мин</div>
    <div class="slot-grid" id="slotGrid"></div>
    <div id="slotEmptyNote"></div>
    <button class="link-btn propose-own" id="proposeOwnBtn">Предложить своё время →</button>
    <div id="bookingFormHolder"></div>
  `;
  const grid = document.getElementById('slotGrid');
  if(!allSlots.length){
    document.getElementById('slotEmptyNote').innerHTML = `<div class="no-slots">В этот день занятия не проводятся.</div>`;
  } else {
    allSlots.forEach(t=>{
      const taken = booked.includes(t);
      const btn = el(`<button class="slot-btn ${taken?'taken':''}">${t}</button>`);
      if(!taken){
        btn.onclick = ()=>{ selectedSlot = t; showBookingForm(false); };
      } else {
        btn.disabled = true;
      }
      grid.appendChild(btn);
    });
  }
  document.getElementById('proposeOwnBtn').onclick = ()=>{ selectedSlot=null; showBookingForm(true); };
}

function showBookingForm(isProposal){
  const holder = document.getElementById('bookingFormHolder');
  holder.innerHTML = `
    <div class="booking-form">
      <div><strong>${isProposal ? 'Предложите удобное время' : 'Занятие в ' + selectedSlot}</strong></div>
      <label>Ваше имя</label>
      <input type="text" id="bfName" placeholder="Как вас записать?">
      ${isProposal ? `<label>Удобное время / комментарий</label><textarea id="bfNote" placeholder="Например: вторник после 19:00, или любой день на следующей неделе"></textarea>` : `<label>Комментарий (необязательно)</label><textarea id="bfNote" placeholder="Что-то важное, что стоит знать перед занятием?"></textarea>`}
      <div class="form-actions">
        <button class="primary-btn" id="bfSubmit">Отправить</button>
        <button class="ghost-btn" id="bfCancel">Отмена</button>
      </div>
    </div>
  `;
  document.getElementById('bfCancel').onclick = ()=>{ holder.innerHTML=''; selectedSlot=null; };
  document.getElementById('bfSubmit').onclick = async ()=>{
    const name = document.getElementById('bfName').value.trim();
    const note = document.getElementById('bfNote').value.trim();
    if(!name){ showToast('Укажите имя'); return; }
    const booking = {
      id: 'b_'+Date.now(),
      date: selectedDateISO,
      time: isProposal ? null : selectedSlot,
      name, note,
      createdAt: new Date().toISOString()
    };
    state.bookings.push(booking);
    await save('bookings');
    holder.innerHTML = `<div class="confirm-msg">Спасибо, ${name}! ${isProposal ? 'Ваше предложение отправлено — репетитор свяжется с вами.' : 'Занятие на '+selectedSlot+' закреплено за вами.'}</div>`;
    renderSlotsPanel();
    setTimeout(()=>{ if(document.getElementById('slotGrid')) renderSlotsPanel(); }, 50);
  };
}

// ---------- скрытый доступ к режиму репетитора ----------
// Открывается только по ссылке вида index.html#teacher + правильный пароль.
// В коде хранится не сам пароль, а его SHA-256 хэш — просмотр исходника его не раскрывает.
// Чтобы задать/сменить пароль: открой консоль браузера (F12) и выполни
//   crypto.subtle.digest('SHA-256', new TextEncoder().encode('ТВОЙ_ПАРОЛЬ')).then(b=>console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
// и вставь результат вместо строки ниже.
const ADMIN_HASH = "ВСТАВЬ_СЮДА_SHA256_ХЭШ_ПАРОЛЯ";

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function tryOpenAdminByHash(){
  if(location.hash !== '#teacher') return;
  const pass = prompt('Пароль режима репетитора:');
  if(pass===null) { history.replaceState(null,'',location.pathname); return; }
  const hash = await sha256(pass);
  if(hash === ADMIN_HASH){
    openAdmin();
  } else {
    showToast('Неверный пароль');
  }
  history.replaceState(null,'',location.pathname); // убираем #teacher из адресной строки
}
window.addEventListener('hashchange', tryOpenAdminByHash);

// ---------- admin drawer ----------
function openAdmin(){
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('overlay').onclick = closeAdmin;
  const drawer = document.getElementById('adminDrawer');
  drawer.classList.remove('hidden');
  renderAdmin();
}
function closeAdmin(){
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('adminDrawer').classList.add('hidden');
}
function renderAdmin(){
  const drawer = document.getElementById('adminDrawer');
  drawer.innerHTML = `
    <div class="drawer-head"><h2>Режим репетитора</h2><button class="ghost-btn" id="closeAdmin">Закрыть ✕</button></div>

    <div class="drawer-section">
      <h3>Сообщение для клиентов</h3>
      <div class="field-row"><textarea id="settHeader" rows="3">${state.settings.headerMessage}</textarea></div>
      <h3>Рабочие часы и длительность</h3>
      <div class="inline-fields field-row">
        <div><label>Начало дня</label><input type="time" id="settWorkStart" value="${state.settings.workStart}"></div>
        <div><label>Конец дня</label><input type="time" id="settWorkEnd" value="${state.settings.workEnd}"></div>
        <div><label>Занятие, мин</label><input type="number" id="settDuration" value="${state.settings.duration}" min="15" step="15"></div>
      </div>
      <button class="primary-btn" id="saveSettingsBtn">Сохранить</button>
    </div>

    <div class="drawer-section">
      <h3>Правила расписания</h3>
      <div id="rulesList"></div>
      <button class="link-btn" id="addRuleBtn">+ Добавить правило</button>
      <div id="ruleFormHolder"></div>
    </div>

    <div class="drawer-section">
      <h3>Заблокировать конкретную дату</h3>
      <div class="inline-fields field-row">
        <input type="date" id="blockDateInput">
        <button class="ghost-btn" id="addBlockBtn" style="flex:none;">Заблокировать</button>
      </div>
      <div id="blockedList"></div>
    </div>

    <div class="drawer-section">
      <h3>Заявки от клиентов</h3>
      <div id="bookingsList"></div>
      <p class="privacy-note">Это общее расписание: все, у кого есть ссылка, видят одни и те же заявки. Если это нежелательно, собирайте контакты клиентов отдельно.</p>
    </div>
  `;
  document.getElementById('closeAdmin').onclick = closeAdmin;
  document.getElementById('saveSettingsBtn').onclick = async ()=>{
    state.settings.headerMessage = document.getElementById('settHeader').value.trim();
    state.settings.workStart = document.getElementById('settWorkStart').value;
    state.settings.workEnd = document.getElementById('settWorkEnd').value;
    state.settings.duration = Number(document.getElementById('settDuration').value)||60;
    await save('settings');
    renderApp(); openAdmin();
    showToast('Настройки сохранены');
  };
  document.getElementById('addRuleBtn').onclick = ()=> showRuleForm();
  document.getElementById('addBlockBtn').onclick = async ()=>{
    const v = document.getElementById('blockDateInput').value;
    if(!v){ showToast('Выберите дату'); return; }
    if(!state.blockedDates.includes(v)) state.blockedDates.push(v);
    await save('blockedDates');
    renderAdmin();
    renderWeek(); renderLegend();
  };
  renderRulesList();
  renderBlockedList();
  renderBookingsList();
}

function renderRulesList(){
  const box = document.getElementById('rulesList');
  box.innerHTML='';
  if(!state.rules.length){ box.appendChild(el(`<p class="empty-note">Правил пока нет.</p>`)); return; }
  state.rules.forEach(r=>{
    const daysLabel = r.days.slice().sort().map(d=>DOW_SHORT[d]).join(', ');
    const winLabel = r.windows.map(w=>`${w.start}–${w.end}`).join(', ');
    let recurLabel = 'действует всегда, начиная с ' + r.startDate;
    if(r.endDate) recurLabel = `действует с ${r.startDate} по ${r.endDate}`;
    const item = el(`<div class="rule-item">
      <div class="row1">
        <div>
          <div class="rule-days-label">${daysLabel}</div>
          <div class="rule-windows-label">${winLabel}</div>
          <div class="rule-recur-label">${recurLabel}</div>
        </div>
        <button class="danger-link">Удалить</button>
      </div>
    </div>`);
    item.querySelector('button').onclick = async ()=>{
      state.rules = state.rules.filter(x=>x.id!==r.id);
      await save('rules');
      renderRulesList(); renderWeek(); renderLegend();
    };
    box.appendChild(item);
  });
}

function showRuleForm(){
  const holder = document.getElementById('ruleFormHolder');
  holder.innerHTML = `
    <div class="rule-item" style="background:var(--gold-soft);">
      <label style="font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:6px;">Дни недели</label>
      <div class="day-checks">
        ${DOW_SHORT.map((d,i)=>`<label class="day-check"><input type="checkbox" value="${i}"><span>${d}</span></label>`).join('')}
      </div>
      <label style="font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:6px;">Временные окна</label>
      <div id="windowsHolder"></div>
      <button class="add-window-btn" id="addWindowBtn">+ добавить окно</button>
      <label style="font-size:12.5px;color:var(--ink-soft);display:block;margin:6px 0 4px;">Повторение</label>
      <select id="recurSelect" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;">
        <option value="forever">Всегда (пока не удалю)</option>
        <option value="year">До конца этого года</option>
        <option value="months">На несколько месяцев</option>
        <option value="range">Свой диапазон дат</option>
      </select>
      <div class="recur-extra" id="recurExtra"></div>
      <div class="form-actions">
        <button class="primary-btn" id="ruleSaveBtn">Сохранить правило</button>
        <button class="ghost-btn" id="ruleCancelBtn">Отмена</button>
      </div>
    </div>
  `;
  const winHolder = document.getElementById('windowsHolder');
  function addWindowRow(start,end){
    const row = el(`<div class="window-row">
      <input type="time" value="${start||'09:00'}">
      <span>–</span>
      <input type="time" value="${end||'21:00'}">
      <button title="удалить">✕</button>
    </div>`);
    row.querySelector('button').onclick = ()=> row.remove();
    winHolder.appendChild(row);
  }
  addWindowRow('09:00','21:00');
  document.getElementById('addWindowBtn').onclick = ()=> addWindowRow();

  const recurSelect = document.getElementById('recurSelect');
  const recurExtra = document.getElementById('recurExtra');
  function renderRecurExtra(){
    const v = recurSelect.value;
    if(v==='months'){
      recurExtra.innerHTML = `<label style="font-size:12px;color:var(--ink-soft);">Сколько месяцев</label><input type="number" id="recurMonths" value="3" min="1" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;">`;
    } else if(v==='range'){
      recurExtra.innerHTML = `<div class="inline-fields"><div><label style="font-size:12px;color:var(--ink-soft);">С</label><input type="date" id="recurStart" value="${todayISO()}"></div><div><label style="font-size:12px;color:var(--ink-soft);">По</label><input type="date" id="recurEnd"></div></div>`;
    } else {
      recurExtra.innerHTML='';
    }
  }
  recurSelect.onchange = renderRecurExtra;
  renderRecurExtra();

  document.getElementById('ruleCancelBtn').onclick = ()=>{ holder.innerHTML=''; };
  document.getElementById('ruleSaveBtn').onclick = async ()=>{
    const days = Array.from(holder.querySelectorAll('.day-check input:checked')).map(x=>Number(x.value));
    if(!days.length){ showToast('Выберите хотя бы один день'); return; }
    const windows = Array.from(winHolder.querySelectorAll('.window-row')).map(row=>{
      const inputs = row.querySelectorAll('input');
      return { start: inputs[0].value, end: inputs[1].value };
    }).filter(w=>w.start && w.end && w.start<w.end);
    if(!windows.length){ showToast('Добавьте хотя бы одно корректное окно времени'); return; }
    let startDate = todayISO(); let endDate = null;
    const rv = recurSelect.value;
    if(rv==='year'){ endDate = new Date().getFullYear()+'-12-31'; }
    else if(rv==='months'){ const n = Number(document.getElementById('recurMonths').value)||3; endDate = toISO(addMonths(new Date(), n)); }
    else if(rv==='range'){ startDate = document.getElementById('recurStart').value || todayISO(); endDate = document.getElementById('recurEnd').value || null; }
    const rule = { id:'r_'+Date.now(), days, windows, startDate, endDate };
    state.rules.push(rule);
    await save('rules');
    holder.innerHTML='';
    renderRulesList(); renderWeek(); renderLegend();
    showToast('Правило добавлено');
  };
}

function renderBlockedList(){
  const box = document.getElementById('blockedList');
  box.innerHTML='';
  if(!state.blockedDates.length){ box.appendChild(el(`<p class="empty-note">Заблокированных дат нет.</p>`)); return; }
  state.blockedDates.slice().sort().forEach(dt=>{
    const item = el(`<div class="blocked-item" style="display:flex;justify-content:space-between;align-items:center;"><span class="mono">${dt}</span><button class="danger-link">Убрать</button></div>`);
    item.querySelector('button').onclick = async ()=>{
      state.blockedDates = state.blockedDates.filter(x=>x!==dt);
      await save('blockedDates');
      renderBlockedList(); renderWeek();
    };
    box.appendChild(item);
  });
}

function renderBookingsList(){
  const box = document.getElementById('bookingsList');
  box.innerHTML='';
  if(!state.bookings.length){ box.appendChild(el(`<p class="empty-note">Пока нет заявок.</p>`)); return; }
  state.bookings.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'')).forEach(b=>{
    const item = el(`<div class="booking-item">
      <div class="row1"><span class="bdate">${b.date || '—'}${b.time ? ', '+b.time : ' (гибко)'}</span><button class="danger-link">Удалить</button></div>
      <div class="bname">${b.name}</div>
      ${b.note ? `<div class="bnote">${b.note}</div>` : ''}
    </div>`);
    item.querySelector('button').onclick = async ()=>{
      state.bookings = state.bookings.filter(x=>x.id!==b.id);
      await save('bookings');
      renderBookingsList(); renderSlotsPanel();
    };
    box.appendChild(item);
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.add('hidden'), 2600);
}

// ---------- init ----------
(async function init(){
  await loadAll();
  renderApp();
  tryOpenAdminByHash();
})();
</script>
